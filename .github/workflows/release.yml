name: release

# Manually triggered from the GitHub "Actions" tab: opens a PR from develop to
# master, waits for CI to pass, merges it, then tags the merge commit and
# creates a GitHub Release. Vercel deploys master to production automatically
# (Git integration, no deploy step needed here). This PR-based flow satisfies
# the branch protection rules on master (no bypass required).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0, without the "v" prefix)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${{ inputs.version }}' — expected semver like 1.2.0"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Open release PR (develop -> master)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --base master --head develop --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base master --head develop \
              --title "release: v${{ inputs.version }}" \
              --body "Automated release PR for v${{ inputs.version }}."
          fi

      - name: Wait for CI and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --base master --head develop --json number --jq '.[0].number')
          sleep 15 # let checks get reported before watching them
          gh pr checks "$pr" --watch
          gh pr merge "$pr" --merge --subject "release: v${{ inputs.version }}"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --target master \
            --title "v${{ inputs.version }}" \
            --generate-notes
